services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: scootberlin_app

    expose:
      - "9000"

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    networks:
      - scootberlin


  nginx:
    image: nginx:alpine
    container_name: scootberlin_nginx

    ports:
      - "8084:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - scootberlin

  postgres:
    image: postgis/postgis:17-3.5

    container_name: scootberlin_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - scootberlin

networks:
  scootberlin:
    driver: bridge

volumes:
  postgres_data: